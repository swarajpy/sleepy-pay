name: Build Android APK

on:
  push:
    branches: [main, new-logo, card-bill-tracker]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sleepy-pay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a release (direct download)
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sleepy-pay.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sleepy-pay.apk --target "${{ github.sha }}" --prerelease \
            --title "Sleepy Pay (latest debug build)" \
            --notes "Debug APK built from commit ${{ github.sha }}. Install sleepy-pay.apk directly on your phone."
